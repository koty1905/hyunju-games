:root {
  color-scheme: dark;
  --ground: #2a1d17;
  --ground-dot: #3a2a21;
  --frame: #fbf3e4;
  --frame-dark: #d9c4a2;
  --ink: #3b2a20;
  --text: #fbf3e4;
  --muted: #cdb89c;
  --red: #d63a3a;
  --gold: #ffc857;
}
html, body { background: var(--ground); }
body {
  margin: 0;
  color: var(--text);
  font: 13px/1.6 Galmuri9, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  background-color: var(--ground);
  background-image: radial-gradient(var(--ground-dot) 1px, transparent 1.5px);
  background-size: 16px 16px;
  padding-inline: 16px;
  padding-block: 20px 28px;
}
.wrap { max-width: 1680px; margin: 0 auto; display: grid; gap: 14px; }
.game { display: grid; gap: 12px; justify-items: center; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
header p { flex: 1 1 16em; margin: 0; color: var(--muted); font-family: Galmuri9, system-ui, sans-serif; }
h1 {
  margin: 0; font: 700 24px/1.2 Galmuri11, system-ui, sans-serif; color: var(--frame);
  text-shadow: 2px 0 var(--ink), -2px 0 var(--ink), 0 2px var(--ink), 0 -2px var(--ink), 3px 3px 0 var(--red);
  letter-spacing: 1px;
}
.fs {
  align-self: center; font: 11px/1 Galmuri11, system-ui, sans-serif; color: var(--ink); cursor: pointer;
  background: var(--frame); border: 0; padding: 7px 10px 8px;
  box-shadow: 0 0 0 2px var(--ink), 0 3px 0 2px var(--red);
}
.fs:hover { background: #fffaf2; }
.fs:active { transform: translateY(2px); box-shadow: 0 0 0 2px var(--ink), 0 1px 0 2px var(--red); }
.fs:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
.screen {
  position: relative;
  /* 창 높이에 맞춰 16:9 화면이 한눈에 들어오게 */
  width: min(100%, calc((100vh - 150px) * 16 / 9 + 12px));
  width: min(100%, calc((100dvh - 150px) * 16 / 9 + 12px));
  min-width: min(100%, 320px);
  background: var(--frame);
  padding: 6px;
  box-shadow: 0 0 0 3px var(--ink), 6px 6px 0 3px var(--red);
}
.screen:fullscreen { width: 100vw; height: 100vh; padding: 0; box-shadow: none; background: #140d0a; display: grid; place-items: center; }
.screen:fullscreen .stage { width: min(100vw, calc(100vh * 16 / 9)); }
.screen:-webkit-full-screen { width: 100vw; height: 100vh; padding: 0; box-shadow: none; background: #140d0a; display: grid; place-items: center; }
.screen:-webkit-full-screen .stage { width: min(100vw, calc(100vh * 16 / 9)); }
.stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: #f1dfc0; box-shadow: inset 0 0 0 2px var(--frame-dark); }
.stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
#game { image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; outline: none; }
#game:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.keys { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 0; padding: 0; list-style: none; color: var(--muted); font-family: Galmuri9, system-ui, sans-serif; }
.keys li { display: flex; align-items: center; gap: 6px; }
kbd {
  font: 11px/1 Galmuri11, ui-monospace, monospace; color: var(--ink); background: #fffaf2;
  padding: 4px 6px 5px; box-shadow: 0 2px 0 var(--frame-dark), 0 0 0 1px var(--ink);
}
footer { color: #9c8670; font-size: 11px; font-family: Galmuri7, Galmuri9, system-ui, sans-serif; }
.ctrl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.btn {
  font: 11px/1 Galmuri11, system-ui, sans-serif; color: var(--ink); cursor: pointer;
  background: var(--frame); border: 0; padding: 7px 10px 8px;
  box-shadow: 0 0 0 2px var(--ink), 0 3px 0 2px var(--frame-dark);
}
.btn.main { background: var(--red); color: var(--frame); box-shadow: 0 0 0 2px var(--ink), 0 3px 0 2px #8e2230; }
.btn:active { transform: translateY(2px); }
.btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
.now { color: var(--muted); font-family: Galmuri9, system-ui, sans-serif; margin-inline-start: 4px; }
@media (max-width: 520px) {
  h1 { font-size: 20px; }
  .screen { padding: 4px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>판다 면제 조항</h1>
    <p>리라 에피소드 2 · 러바오 특별 출연. 이 세계에서 노동을 면제받는 존재는 딱 하나다.</p>
    <button class="fs" id="fs" type="button">전체 화면</button>
  </header>
  <div class="game">
  <div class="screen" id="screen">
    <div class="stage">
      <canvas id="game" width="1280" height="720" tabindex="0" aria-label="판다 면제 조항 픽셀 애니메이션. 화면을 누르면 재생하거나 멈춰요."></canvas>
    </div>
  </div>
  <div class="ctrl" role="group" aria-label="재생 조작">
    <button class="btn" id="restart" type="button">처음부터</button>
    <button class="btn" id="prev" type="button">◀ 이전 장면</button>
    <button class="btn main" id="play" type="button">▶ 재생</button>
    <button class="btn" id="next" type="button">다음 장면 ▶</button>
    <button class="btn" id="mute" type="button">소리</button>
    <span class="now" id="scene" aria-live="polite">처음 화면</span>
  </div>
  <ul class="keys" aria-label="조작법">
    <li><kbd>Space</kbd> 재생 · 멈춤</li>
    <li><kbd>← →</kbd> 장면 이동</li>
    <li><kbd>R</kbd> 처음부터</li>
    <li><kbd>M</kbd> 소리</li>
    <li><kbd>F</kbd> 전체 화면</li>
  </ul>
  </div>
  <footer>리라 세계관 팬 창작 애니메이션입니다. 러바오는 사진을 보고 새로 그린 픽셀 그림이고, 그림과 소리는 모두 코드로 만들었어요. 글꼴: 갈무리(Galmuri, SIL OFL 1.1).</footer>
</div>
<script>
'use strict';
(() => {
// 판다 면제 조항 — 공통 부분: 화면 맞추기, 색, 글꼴, 소리, 픽셀 격자, 리라·갓파더 그림
// (sync_common.py 가 퇴근 불가 rira-shift/src/game.js 에서 그대로 옮겨 온다. 여기서 고치지 말 것)
const W = 320, H = 180;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let S = 4;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const lerp = (a, b, t) => a + (b - a) * t;
const coarse = matchMedia('(pointer: coarse)').matches;

function fit() {
  const r = cv.getBoundingClientRect();
  let s = Math.ceil((r.width || 960) * (devicePixelRatio || 1) / W);
  s = clamp(s + (s % 2), 2, 12); // 짝수 배율이어야 0.5칸(고해상도 픽셀)이 기기 픽셀에 딱 맞는다
  if (s !== S || cv.width !== W * s) { S = s; cv.width = W * S; cv.height = H * S; }
}
if (window.ResizeObserver) new ResizeObserver(fit).observe(cv);
fit();

// ---------- 전체 화면
const screenEl = document.getElementById('screen') || cv;
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
function toggleFS() {
  try {
    if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else {
      const req = screenEl.requestFullscreen || screenEl.webkitRequestFullscreen;
      if (!req) throw new Error('unsupported');
      const r = req.call(screenEl);
      if (r && r.catch) r.catch(() => toast('이 화면에서는 전체 화면을 쓸 수 없어요'));
    }
  } catch (e) { toast('이 화면에서는 전체 화면을 쓸 수 없어요'); }
  cv.focus({ preventScroll: true });
}
const fsBtn = document.getElementById('fs');
if (fsBtn) {
  fsBtn.addEventListener('click', toggleFS);
  const sync = () => { fsBtn.textContent = fsEl() ? '전체 화면 끝내기' : '전체 화면'; };
  document.addEventListener('fullscreenchange', sync); document.addEventListener('webkitfullscreenchange', sync);
}

// ---------- 색

// 러바오 편 공통: 러바오·누운 갓파더·판다 흉내 그림, 소품(오븐·상자·표지판·판매대·문), 더한 소리와 곡
// (애니메이션 판다 면제 조항과 게임 panda-shift 가 함께 쓴다)
// ---------- 러바오 (선 앞모습 84x80 격자 = 42x40칸, 몸 가운데 x=32). 참조: 러바오 사진과 스프라이트 시트
// 크기는 리라(키 23칸)와 갓파더(키 50칸)의 중간.
// 두 발로 서서 까만 팔을 몸 앞으로 늘어뜨린 모습. 둥글고 볼이 통통한 흰 얼굴, 아래 바깥으로 처진 타원 눈 패치,
// 까만 동그란 귀, 까만 코, 태연한 표정, 크고 둥근 흰 배, 팔로 이어지는 까만 어깨, 짧은 까만 다리. 턱 아래 털은 살짝 베이지.
const PB = { w: '#f6f2ea', w2: '#e9dfcd', k: '#221e24', k2: '#3a343f', ol: '#17141a', eye: '#6a4630', nose: '#141116', pad: '#4f4852', mouth: '#9a8d84', tongue: '#ec8c9a', lid: '#6d6570' };
function bamboo(g, x0, y0, x1, y1) {
  gline(g, x0, y0, x1, y1, '#6fae3f', 4);
  const n = Math.hypot(x1 - x0, y1 - y0);
  for (let d = 8; d < n; d += 10) { const t = d / n; gline(g, x0 + (x1 - x0) * t - 2, y0 + (y1 - y0) * t, x0 + (x1 - x0) * t + 2, y0 + (y1 - y0) * t, '#4e8a2c', 1); }
  const ux = (x1 - x0) / n, uy = (y1 - y0) / n;
  gaxis(g, x1 + ux * 3 - uy * 4, y1 + uy * 3 + ux * 4, 2.4, 6, ux - uy, uy + ux, '#9ccf5e');
  gaxis(g, x1 + ux * 3 + uy * 4, y1 + uy * 3 - ux * 4, 2.4, 6, ux + uy, uy - ux, '#8cc453');
}
// arm: idle 팔 늘어뜨림 · hold 두 앞발로 대나무 · chest 두 앞발 모으기(기다리기) · cross 팔짱(검토)
//      wave 손 흔들기 · up 두 팔 번쩍(점프) · offer 대나무 내밀기 / down: 고개 숙이기(실패)
function lebao(o = {}) {
  const arm = o.arm || 'idle', chew = o.chew ? 1 : 0, blink = o.blink ? 1 : 0, bam = o.bam == null ? 3 : o.bam, paper = o.paper || 0, down = o.down ? 1 : 0;
  return spr(`lb|${arm}|${chew}|${blink}|${bam}|${paper}|${down}`, 84, 80, g => {
    const W1 = PB.w, K = PB.k, hy = 22 + down * 3;
    // 짧은 까만 다리와 발
    for (const s of [-1, 1]) { gell(g, 32 + s * 9, 72.5, 7.5, 6, K); gell(g, 32 + s * 10, 77, 6.5, 2.2, K); }
    // 팔로 이어지는 까만 어깨, 크고 둥근 흰 배
    gell(g, 32, 40, 23, 8.5, K);
    gell(g, 32, 56, 18.5, 19, W1); gell(g, 32, 53, 15, 16, W1);
    // 팔
    const paw = (x, y) => gell(g, x, y, 4.3, 4, K);
    const hang = s => { gaxis(g, 32 + s * 16, 51, 5, 11, -s * 3, 16, K); paw(32 + s * 14, 61.5); };
    const bent = s => { gaxis(g, 32 + s * 10.5, 45.5, 4.8, 8, -s * 12, 6, K); paw(32 + s * 3.8, 48.5); };
    const raised = s => { gaxis(g, 32 + s * 21, 31, 4.5, 10, s * 6, -18, K); paw(32 + s * 24, 21); };
    if (arm === 'idle') { hang(-1); hang(1); }
    else if (arm === 'chest') { bent(-1); bent(1); }
    else if (arm === 'hold') { if (bam) bamboo(g, 32, 56, 32, 56 - [0, 9, 16, 22][bam]); bent(-1); bent(1); }
    else if (arm === 'cross') { gaxis(g, 32, 45.5, 4.8, 16.5, 1, .22, K); gaxis(g, 32, 50, 4.8, 16.5, 1, -.22, K); paw(16.5, 48.5); paw(47.5, 46.5); }
    else if (arm === 'wave') { hang(-1); raised(1); }
    else if (arm === 'up') { raised(-1); raised(1); }
    else if (arm === 'offer') { hang(-1); gaxis(g, 58, 43, 4.5, 10.5, 18, 2, K); paw(69, 44); bamboo(g, 70, 44, 82, 42); }
    // 머리: 까만 동그란 귀, 둥글고 통통한 얼굴
    for (const s of [-1, 1]) gell(g, 32 + s * 16.5, hy - 14 + down, 6.5, 6, K);

    gout(g, PB.ol);
    // 턱 아래는 연한 베이지 (사진처럼)
    for (let y = hy + 6; y < hy + 22; y++) for (let x = 10; x < 56; x++) if (gget(g, x, y) === W1 && hash(x, y) % 4 < (y - hy - 6) / 4) gset(g, x, y, PB.w2);
    gtex(g, W1, '#ede7dc', null, 17);
    gtex(g, K, PB.k2, null, 29);
    // 아래 바깥으로 처진 타원 눈 패치와 갈색 눈
    gaxis(g, 23, hy + 1, 3.9, 5.7, -.45, 1, K); gaxis(g, 41, hy + 1, 3.9, 5.7, .45, 1, K);
    for (const x0 of [24, 38]) {
      const ey = hy - 1 + down;
      if (blink) grect(g, x0 - 1, ey + 1, 3, 1, PB.lid);
      else { grect(g, x0, ey, 2, 2, '#1a0f08'); gset(g, x0 + (x0 < 32 ? 1 : 0), ey, PB.eye); gset(g, x0 + (x0 < 32 ? 0 : 1), ey, '#ffffff'); }
    }
    // 까만 코와 작은 입
    const N = PB.nose, ny = hy + 6;
    grect(g, 30, ny, 4, 1, N); grect(g, 29, ny + 1, 6, 1, N); grect(g, 30, ny + 2, 4, 1, N); grect(g, 31, ny + 3, 2, 1, N);
    gset(g, 30, ny, '#4a4550');
    if (chew) { gell(g, 32, ny + 6, 2.2, 1.6, PB.ol); gset(g, 31, ny + 6, PB.tongue); gset(g, 32, ny + 6, PB.tongue); }
    else if (down) { gset(g, 30, ny + 6, PB.mouth); gset(g, 31, ny + 5, PB.mouth); gset(g, 32, ny + 5, PB.mouth); gset(g, 33, ny + 6, PB.mouth); }
    else { gset(g, 31, ny + 4, PB.mouth); gset(g, 32, ny + 4, PB.mouth); gset(g, 30, ny + 5, PB.mouth); gset(g, 33, ny + 5, PB.mouth); }
    grect(g, 19, hy + 7, 2, 1, '#f1d3d1'); grect(g, 43, hy + 7, 2, 1, '#f1d3d1');
  });
}

  R(x + w / 2 - 1, y, 2, h, P.woodD); R(x, y + h / 2 - 1, w, 2, P.woodD);

function room(sky, o = {}) {

  const k = kind === 'rira2' ? 'rira' : kind, mood = o.mood || (kind === 'rosemarira' ? 'st' : kind === 'seraphina' ? 'so' : 'n');
  if (o.walk) { blit(riraSide(k, Math.floor(T * 8 + ph) % 4, { ear, mood }), x - 10, fy - 23, o.face < 0); return; }
  blit(rira(k, { mood, ear, arm: o.arm || 'd', blink }), x - 10, fy - 23 + hop, o.face > 0);
}
function drawLB(x, fy, o = {}) {
  const chew = o.chew ? Math.floor(T * 5) % 2 : 0, blink = ((T * .5) % 4) < .12;
  if (o.run) { blit(lebaoRun(Math.floor(T * 10) % 4), x - 24, fy - 30, o.face < 0); return; }

}
function drawGF(x, fy, o = {}) {

}
function speech(x, y, s) {
  const lines = wrapChars(s, F.s, 110), w = Math.max(...lines.map(l => tw(l, F.s))) + 8, h = lines.length * 9 + 5;
  const bx = clamp(x - w / 2, 2, W - w - 2), by = Math.max(2, y - h - 4);
  box(bx, by, w, h, P.paper, P.ink);
  const tx = clamp(x - 1, bx + 3, bx + w - 5);
  R(tx, by + h - 1, 3, 2, P.paper); R(tx, by + h + 1, 2, 2, P.ink);
  lines.forEach((l, i) => text(l, bx + 4, by + 3 + i * 9, { f: F.s }));
}
function sysWin(msg, kind, t, mini) {
  const n = Math.floor(t * 24), edge = kind === 'bad' ? '#ff6b6b' : kind === 'new' ? P.gold : P.pink;
  const f = mini ? F.b : F.sys;
  let lines = [msg];

  const w = mini ? tw(msg, f) + 20 : 260, lh = mini ? 13 : 20, h = (mini ? 22 : 30) + lines.length * lh;
  const x = mini ? clamp(mini[0] - w / 2, 2, W - w - 2) : (W - w) / 2, y = mini ? mini[1] : 56;
  R(x - 2, y - 2, w + 4, h + 4, P.ink); R(x, y, w, h, P.navy); R(x + 2, y + 2, w - 4, h - 4, P.white); R(x + 3, y + 3, w - 6, h - 6, P.navy);
  R(x + 3, y + 3, w - 6, 1, edge);
  text('SYSTEM', x + 7, y + 5, { f: F.s, c: edge });
  let left = n;
  lines.forEach((l, i) => { text(l.slice(0, Math.max(0, left)), x + w / 2, y + (mini ? 13 : 18) + i * lh, { f, a: 'center', c: P.white }); left -= l.length + 1; });
}

const ez = t => t < .5 ? 2 * t * t : 1 - ((-2 * t + 2) ** 2) / 2;
function sparkles(cx, cy, r, n = 10) {

      // 17시 정각, 러바오는 스스로 뛰어서 상자로 퇴근한다
      if (t < 2.2) drawLB(lerp(330, cx, ez(k01(t, .6, 2.2))), FY + 2, { run: true, face: -1 });
      else if (open > 0) drawLB(cx, FY - 3, { arm: t < 3.8 ? 'wave' : 'idle', chew: false });
      crateFront(cx, FY, open);
      if (on(t, 2.3, 3.8)) speech(cx + 26, FY - 52, '(흔들흔들)');
      ['alps', 'sister', 'seraphina'].forEach((id, i) => drawR(id, 30 + i * 22, FY + (i % 2) * 4, { face: 1, arm: 'b', mood: 'h', flap: true }));
      ['rosemarira', 'rosie', 'clerk'].forEach((id, i) => drawR(id, 244 + i * 22, FY + (i % 2) * 4, { face: -1, arm: 'b', mood: id === 'rosemarira' ? 'st' : 'h', flap: true }));
      tag('17:00');
      if (on(t, 5.4, 8.4)) sysWin('LE BAO: DAY OFF CONFIRMED.', 'ok', t - 5.4);
      if (on(t, 8.4, 11)) { speech(52, FY - 26, '또 오세요!'); speech(266, FY - 26, '다음 주 토요일!'); }
    } },
  { name: '갓파더의 퇴근 시도', dur: 13, music: null, cues: [[2.6, () => SFX.confirmed()], [5.2, () => SFX.rira()]],
    draw(t) {
      if (t < 5) {
        room('eve');
        door(270, FY - 40);
        drawGF(lerp(90, 214, ez(k01(t, 0, 2.4))), FY + 8, { face: 1, walk: t < 2.4 });
        drawR('clerk', 256, FY - 36 + 23 + 4, { face: -1 });
        tag('17:05');
        if (on(t, 2.6, 5)) sysWin("TOMORROW'S SHIFT CONFIRMED.", 'ok', t - 2.6);
        return;
      }
      if (t < 8.6) {
        for (let i = 0; i < 9; i++) R(0, i * 20, W, 20, mixHex('#ffe3ea', '#fff6e6', i / 8));
        sparkles(W / 2, 96, 90, 14);
        blit(rira('rosie', { mood: 'h', ear: Math.sin(T * 20), arm: 'b' }), W / 2 - 50, 46 + (Math.sin(T * 8) > .5 ? -1 : 0), false, 5);
        if (t > 5.4) speech(W / 2 + 90, 48, '다음 주 토요일에 봬요, 갓파더님!');
        return;
      }
      R(0, 0, W, H, '#3b2f28');
      for (let i = 0; i < 8; i++) R(0, i * 22, W, 1, '#43362e');
      blit(anteaterFace(on(t, 11.2, 11.35)), W / 2 - 75, H - 138, false, 3);
    } },
  { name: '매주 토요일', dur: 8, music: 'box', cues: [[1, () => SFX.paper()], [2.6, () => SFX.rira()]],
    draw(t) {
      room('eve');
      const cx = 160;
      crateBack(cx, FY); crateFront(cx, FY, 0);
      blit(disc(3, '#2a1d14'), cx + 14, FY - 14);
      if (t > 2.4) { const wv = Math.sin(T * 7) * 1.5; blit(disc(3, PB.k), cx + 15 + wv, FY - 19); blit(disc(1, PB.pad), cx + 17 + wv, FY - 16); for (let i = 0; i < 3; i++) R(cx + 16 + i * 1.5 + wv, FY - 18, 1, 1, PB.pad); }
      const k = ez(k01(t, .8, 1.6));
      if (k > 0) {
        ctx.save(); ctx.translate(cx, 44); ctx.scale(.4 + k * .6, .4 + k * .6); ctx.rotate(.04);
        box(-70, -24, 140, 48, '#fff8e0', P.woodD); R(-3, -26, 6, 3, P.red);
        text('러바오 정기 방문', 0, -20, { f: F.b, a: 'center', c: P.redD });
        text('매주 토요일', 0, -4, { f: F.m, a: 'center' });
        text('전담 매니저: 갓파더', 0, 9, { f: F.m, a: 'center', c: P.navyL });
        ctx.restore();
      }
      if (t > 4.4) text('— 다음 주 토요일에 계속 —', W / 2, 165, { f: F.m, a: 'center', c: P.paper, o: P.ink });
    } },
];

// ---------- 진행
let MODE = 'title', SI = 0, ST = 0, T = 0, playing = false;
let toastMsg = '', toastT = 0;
function toast(m) { toastMsg = m; toastT = 2.2; }
const ui = { play: document.getElementById('play'), label: document.getElementById('scene') };
function syncUI() {
  if (ui.play) ui.play.textContent = MODE === 'play' && playing ? '일시정지' : '▶ 재생';
  if (ui.label) ui.label.textContent = MODE === 'title' ? '처음 화면' : MODE === 'fin' ? '끝' : `${SI + 1} / ${SCENES.length} · ${SCENES[SI].name}`;
}
function go(i) { SI = clamp(i, 0, SCENES.length - 1); ST = 0; MODE = 'play'; playTrack(SCENES[SI].music); syncUI(); }
function start() { audio(); playing = true; go(0); }
function toggle() {
  audio();
  if (MODE === 'title' || MODE === 'fin') return start();
  playing = !playing;
  if (AU.ac) { if (playing) AU.ac.resume(); else AU.ac.suspend(); }
  syncUI();
}
function step(d) {
  audio();
  if (MODE === 'fin') { if (d < 0) { playing = true; go(SCENES.length - 1); } return; }
  if (MODE === 'title') return start();
  if (d > 0 && SI === SCENES.length - 1) return finish();
  go(SI + d);
}
function finish() { MODE = 'fin'; playing = false; playTrack('box'); syncUI(); }
function toggleSound() {
  G.music = G.sfx = !G.music; audio();
  try { localStorage.setItem('panda-clause-v1', JSON.stringify({ sound: G.music })); } catch (e) { /* 무시 */ }
  if (AU.mus) AU.mus.gain.value = G.music ? .32 : 0; if (AU.fx) AU.fx.gain.value = G.sfx ? .6 : 0;
  toast(G.music ? '소리 켬' : '소리 끔');
}
try { const s = JSON.parse(localStorage.getItem('panda-clause-v1') || '{}'); if (s.sound === false) G.music = G.sfx = false; } catch (e) { /* 무시 */ }

function update(dt) {
  T += dt; toastT -= dt;
  musicTick();
  if (MODE !== 'play' || !playing) return;
  const sc = SCENES[SI], prev = ST;
  ST += dt;
  for (const [ct, fn] of sc.cues) if (prev < ct && ct <= ST) fn();
  if (ST >= sc.dur) { if (SI < SCENES.length - 1) go(SI + 1); else finish(); }
}
function drawTitle() {
  room('day');
  ctx.globalAlpha = .3; R(0, 0, W, H, '#1a120d'); ctx.globalAlpha = 1;
  blit(lebao({ arm: 'hold', chew: Math.floor(T * 4) % 2, bam: 3, blink: (T % 4) < .12 }), 172, 34, false, 4);
  sparkles(236, 104, 70, 12);
  text('판다 면제 조항', 14, 16, { f: F.xl, c: P.cr, o: P.ink, ow: 2 });
  text('리라 에피소드 2 · 러바오 특별 출연', 16, 50, { f: F.m, c: P.cr, o: P.ink });
  // 인형 사진처럼 앉아서 분홍 발바닥을 보이는 리라와 친구들
  [['rira', 14], ['rira2', 58], ['rosie', 102]].forEach(([id, x], i) => blit(rira(id === 'rira2' ? 'rira' : id, { sit: true, mood: 'h', ear: (T % 3) < .6 ? Math.sin(T * 30 + i) : Math.sin(T * 2 + i) * .34, blink: ((T * .7 + i) % 3.1) < .1 }), x, 104 + (Math.sin(T * 3 + i * 2) > .85 ? -1 : 0), false, 2));
  if (Math.floor(T * 2) % 2) text(coarse ? '▶ 화면을 눌러 보기' : '▶ Space · 화면을 눌러 보기', 16, 162, { f: F.m, c: P.cr, o: P.ink });
}
function drawFin() {
  room('eve');
  ctx.globalAlpha = .55; R(0, 0, W, H, '#1a120d'); ctx.globalAlpha = 1;
  text('끝', W / 2, 22, { f: F.xl, a: 'center', c: P.cr, o: P.ink, ow: 2 });
  text('출연', W / 2, 60, { f: F.s, a: 'center', c: P.gold });
  text('러바오 · 갓파더 · 알프스 리라 · 시스터 리라 · 세라피나', W / 2, 72, { f: F.s, a: 'center', c: P.cr });
  text('로즈마리라 · 로지 · 문지기 리라 · 행정 리라', W / 2, 82, { f: F.s, a: 'center', c: P.cr });
  drawLB(W / 2, 160, { chew: true, bam: 2, arm: 'hold' });
  if (Math.floor(T * 2) % 2) text(coarse ? '화면을 눌러 다시 보기' : 'Space · 화면을 눌러 다시 보기', W / 2, 172 - 76, { f: F.m, a: 'center', c: P.cr, o: P.ink });
}
function draw() {
  ctx.setTransform(S, 0, 0, S, 0, 0); ctx.imageSmoothingEnabled = false;
  R(0, 0, W, H, P.wall);
  if (MODE === 'title') drawTitle();
  else if (MODE === 'fin') drawFin();
  else {
    const sc = SCENES[SI];
    sc.draw(ST);
    const a = Math.max(0, 1 - ST / .35, 1 - (sc.dur - ST) / .35);
    if (a > 0) { ctx.globalAlpha = Math.min(1, a); R(0, 0, W, H, '#1a120d'); ctx.globalAlpha = 1; }
    if (!playing) { box(W - 50, 6, 44, 15, P.navy, P.ink); text('일시정지', W - 26, 8, { f: F.m, a: 'center', c: P.paper }); }
  }
  if (toastT > 0) { const w = tw(toastMsg, F.m) + 14; box(W / 2 - w / 2, 64, w, 15, P.ink, P.ink); text(toastMsg, W / 2, 66, { f: F.m, a: 'center', c: P.paper }); }
}

// ---------- 입력
addEventListener('keydown', e => {
  const k = e.key;
  if (e.target && e.target.tagName === 'BUTTON' && (k === ' ' || k === 'Enter')) return;
  if (k === ' ' || k === 'Enter') { e.preventDefault(); if (!e.repeat) toggle(); }
  else if (k === 'ArrowLeft') { e.preventDefault(); step(-1); }
  else if (k === 'ArrowRight') { e.preventDefault(); step(1); }
  else if (k === 'r' || k === 'R') start();
  else if (k === 'm' || k === 'M') toggleSound();
  else if (k === 'f' || k === 'F') toggleFS();
});
cv.addEventListener('pointerdown', e => { e.preventDefault(); cv.focus({ preventScroll: true }); toggle(); });
const bind = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); };
bind('restart', start); bind('prev', () => step(-1)); bind('play', toggle); bind('next', () => step(1)); bind('mute', toggleSound);

// ---------- 루프
let last = 0;
function frame(ts) {
  const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
  fit(); update(dt); draw();
  requestAnimationFrame(frame);
}
// 자동 시험용 (주소에 ?test 가 있을 때만)
if (/[?&]test\b/.test(location.search)) window.__A = { rira, riraSide, lebao, lebaoRun, go, start, st: () => ({ MODE, SI, ST, playing }), seek: (i, t) => { go(i); ST = t; playing = false; } };
function boot() { ASC = {}; syncUI(); requestAnimationFrame(frame); }
const fams = ['7.5px Galmuri14', '10px Galmuri9', '12px Galmuri11', 'bold 12px Galmuri11', 'bold 18px Galmuri11', 'bold 24px Galmuri11'];
if (document.fonts && document.fonts.load) {
  Promise.race([Promise.all(fams.map(f => document.fonts.load(f, '가A'))), new Promise(r => setTimeout(r, 2000))]).then(boot, boot);
} else boot();
})();

</script>
</body>
