<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뱀 게임</title>
<style>
  :root {
    --lcd: #c7f0d8; --ink: #43523d; --body: #2a2f28; --bezel: #161915; --fg: #e4e9df; --muted: #9aa392;
    --size: min(440px, calc(100vw - 72px), calc(100vh - 170px));
  }
  @supports (height: 100svh) { :root { --size: min(440px, calc(100vw - 72px), calc(100svh - 170px)); } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--body); color: var(--fg); display: flex; flex-direction: column; align-items: center;
         font: 15px/1.4 "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
         touch-action: manipulation; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
  header { width: 100%; max-width: 520px; display: flex; align-items: center; gap: 12px; padding: 10px 16px 8px; }
  header a { color: var(--muted); text-decoration: none; font-size: .85rem; }
  header a:hover { color: var(--fg); }
  h1 { font-size: 1.05rem; margin: 0; }
  header button { margin-left: auto; }
  .bezel { background: var(--bezel); border-radius: 18px; padding: 14px; box-shadow: inset 0 0 0 2px #232722, 0 6px 18px rgba(0,0,0,.35); }
  .lcd { position: relative; background: var(--lcd); border-radius: 6px; padding: 8px 10px 10px; color: var(--ink);
         box-shadow: inset 0 0 18px rgba(67, 82, 61, .25); touch-action: none; }
  .lcd-top { display: flex; justify-content: space-between; font: 700 1rem/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
             letter-spacing: .08em; margin-bottom: 6px; width: var(--size); }
  canvas { display: block; width: var(--size); height: var(--size); image-rendering: pixelated; image-rendering: crisp-edges; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
             gap: 10px; text-align: center; padding: 16px; background: rgba(199, 240, 216, .9); border-radius: 6px; }
  .overlay[hidden] { display: none; }
  .overlay h2 { margin: 0; font: 700 1.5rem/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .12em; }
  .overlay p { margin: 0; font-size: .9rem; }
  button { font: inherit; font-size: .85rem; color: var(--fg); background: #3a4136; border: 1px solid #4d5548; border-radius: 8px;
           padding: 6px 12px; cursor: pointer; }
  .overlay button { background: var(--ink); color: var(--lcd); border: none; font-weight: 700; font-size: 1rem; padding: 9px 22px; }
  .keys { color: var(--muted); font-size: .8rem; margin: 12px 0 0; }
  .pad { display: none; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(3, 52px); gap: 6px; margin-top: 14px; }
  .pad button { font-size: 1.3rem; touch-action: none; padding: 0; }
  .pad [data-dir=up] { grid-area: 1 / 2; } .pad [data-dir=left] { grid-area: 2 / 1; } .pad [data-dir=pause] { grid-area: 2 / 2; font-size: .85rem; }
  .pad [data-dir=right] { grid-area: 2 / 3; } .pad [data-dir=down] { grid-area: 3 / 2; }
  @media (hover: none) and (pointer: coarse) {
    :root { --size: min(440px, calc(100vw - 72px), calc(100vh - 330px)); }
    @supports (height: 100svh) { :root { --size: min(440px, calc(100vw - 72px), calc(100svh - 330px)); } }
    .pad { display: grid; }
    .keys { display: none; }
  }
</style>
</head>
<body>
<header>
  <a href="../">← 게임 목록</a>
  <h1>뱀 게임</h1>
  <button id="pauseBtn" type="button">멈춤</button>
</header>
<div class="bezel">
  <div class="lcd" id="lcd">
    <div class="lcd-top"><span id="score">0000</span><span id="best">HI 0000</span></div>
    <canvas id="cv" width="84" height="84"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">SNAKE</h2>
      <p id="ovText">먹이를 먹을수록 길어지고 빨라집니다.<br>벽이나 제 몸에 부딪히면 끝.</p>
      <button id="ovBtn" type="button">시작</button>
    </div>
  </div>
</div>
<p class="keys">방향키(WASD)로 움직이고, Space로 멈춥니다. 화면을 밀어서 방향을 바꿀 수도 있습니다.</p>
<div class="pad">
  <button type="button" data-dir="up" aria-label="위">▲</button>
  <button type="button" data-dir="left" aria-label="왼쪽">◀</button>
  <button type="button" data-dir="pause" aria-label="멈춤">멈춤</button>
  <button type="button" data-dir="right" aria-label="오른쪽">▶</button>
  <button type="button" data-dir="down" aria-label="아래">▼</button>
</div>
<script>
const N = 20, CELL = 4, OFF = 2;          // 20×20칸, 칸당 4픽셀, 테두리 안쪽 2픽셀부터
const LCD = '#c7f0d8', INK = '#43523d';
const DIRS = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const cv = $('cv'), ctx = cv.getContext('2d');

let snake = [], dir = DIRS.right, dirQueue = [], food = null, score = 0, stepMs = 150;
let state = 'ready', acc = 0, last = performance.now(), deadAt = 0;
let best = Number(store.get('snake-best')) || 0;

function reset() {
  snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
  dir = DIRS.right; dirQueue = []; score = 0; stepMs = 150; acc = 0;
  placeFood();
}
function placeFood() {
  const free = [];
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!snake.some((s) => s.x === x && s.y === y)) free.push({ x, y });
  food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
}
function turn(d) {
  const ref = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
  if ((d.x === -ref.x && d.y === -ref.y) || (d.x === ref.x && d.y === ref.y)) return;
  if (dirQueue.length < 2) dirQueue.push(d);
}
function step() {
  if (dirQueue.length) dir = dirQueue.shift();
  const h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  const eating = food && h.x === food.x && h.y === food.y;
  const body = eating ? snake : snake.slice(0, -1);
  if (h.x < 0 || h.y < 0 || h.x >= N || h.y >= N || body.some((s) => s.x === h.x && s.y === h.y)) { die(); return; }
  snake.unshift(h);
  if (eating) {
    score += 10 + Math.floor((150 - stepMs) / 10);
    stepMs = Math.max(65, stepMs - 3);
    placeFood();
    if (!food) { die(true); return; }
  } else snake.pop();
  hud();
}
function die(won) {
  state = 'dying'; deadAt = performance.now();
  if (score > best) { best = score; store.set('snake-best', best); }
  hud();
  setTimeout(() => {
    state = 'over';
    showOverlay(won ? 'CLEAR!' : 'GAME OVER', `점수 ${score} · 길이 ${snake.length}`, '다시 하기');
  }, 1100);
}

function pad4(n) { return String(n).padStart(4, '0'); }
function hud() { $('score').textContent = pad4(score); $('best').textContent = 'HI ' + pad4(Math.max(best, score)); }
function showOverlay(title, text, btn) {
  $('ovTitle').textContent = title; $('ovText').textContent = text; $('ovBtn').textContent = btn;
  $('overlay').hidden = false;
}
function start(firstDir) {
  reset(); state = 'play'; $('overlay').hidden = true; last = performance.now();
  if (firstDir && firstDir !== DIRS.left) turn(firstDir);
  hud();
}
function togglePause() {
  if (state === 'play') { state = 'pause'; showOverlay('PAUSE', '', '계속'); }
  else if (state === 'pause') { state = 'play'; $('overlay').hidden = true; last = performance.now(); }
}

function px(x, y, w = 1, h = 1) { ctx.fillRect(x, y, w, h); }
function draw() {
  ctx.fillStyle = LCD; ctx.fillRect(0, 0, 84, 84);
  ctx.fillStyle = INK;
  px(0, 0, 84, 1); px(0, 83, 84, 1); px(0, 0, 1, 84); px(83, 0, 1, 84);   // 테두리
  const blink = state === 'dying' && Math.floor((performance.now() - deadAt) / 160) % 2 === 1;
  if (!blink) {
    snake.forEach((s, i) => {
      const x = OFF + s.x * CELL, y = OFF + s.y * CELL;
      px(x, y, 3, 3);
      if (i > 0) {                                  // 앞 마디와 잇기
        const p = snake[i - 1];
        if (p.x === s.x + 1) px(x + 3, y, 1, 3);
        if (p.x === s.x - 1) px(x - 1, y, 1, 3);
        if (p.y === s.y + 1) px(x, y + 3, 3, 1);
        if (p.y === s.y - 1) px(x, y - 1, 3, 1);
      }
    });
    if (snake.length) {                             // 눈
      const h = snake[0], x = OFF + h.x * CELL, y = OFF + h.y * CELL;
      ctx.fillStyle = LCD;
      px(x + (dir.x > 0 ? 2 : dir.x < 0 ? 0 : 1), y + (dir.y > 0 ? 2 : dir.y < 0 ? 0 : 1));
      ctx.fillStyle = INK;
    }
  }
  if (food) {
    const x = OFF + food.x * CELL, y = OFF + food.y * CELL;
    px(x + 1, y); px(x, y + 1); px(x + 2, y + 1); px(x + 1, y + 2);
  }
}

function frame(t) {
  const dt = Math.min(250, t - last); last = t;
  if (state === 'play') {
    acc += dt;
    while (acc >= stepMs && state === 'play') { acc -= stepMs; step(); }
  }
  draw();
  requestAnimationFrame(frame);
}

function press(name) {
  if (name === 'pause') {
    if (state === 'play' || state === 'pause') togglePause(); else if (state !== 'dying') start();
    return;
  }
  const d = DIRS[name];
  if (state === 'play') turn(d);
  else if (state === 'ready' || state === 'over') start(d);
}
const KEYS = { ArrowUp: 'up', w: 'up', ArrowDown: 'down', s: 'down', ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right',
               ' ': 'pause', p: 'pause', Escape: 'pause', Enter: 'pause' };
addEventListener('keydown', (e) => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (!(k in KEYS)) return;
  e.preventDefault();
  if (k === 'Escape' && state !== 'play' && state !== 'pause') return;
  press(KEYS[k]);
});
let sx = null, sy = null;
const lcd = $('lcd');
lcd.addEventListener('touchstart', (e) => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
lcd.addEventListener('touchend', (e) => {
  if (sx === null || e.target.closest('button')) { sx = null; return; }
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy; sx = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  press(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
});
document.querySelectorAll('.pad button').forEach((b) => b.addEventListener('pointerdown', (e) => { e.preventDefault(); press(b.dataset.dir); }));
$('ovBtn').addEventListener('click', () => { if (state === 'pause') togglePause(); else start(); });
$('pauseBtn').addEventListener('click', () => { if (state === 'play' || state === 'pause') togglePause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });

reset(); hud();
requestAnimationFrame(frame);
</script>
</body>
</html>
