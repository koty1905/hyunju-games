:root {
  color-scheme: dark;
  --ground: #2a1d17;
  --ground-dot: #3a2a21;
  --frame: #fbf3e4;
  --frame-dark: #d9c4a2;
  --ink: #3b2a20;
  --text: #fbf3e4;
  --muted: #cdb89c;
  --red: #d63a3a;
  --gold: #ffc857;
}
html, body { background: var(--ground); }
body {
  margin: 0;
  color: var(--text);
  font: 13px/1.6 Galmuri9, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  background-color: var(--ground);
  background-image: radial-gradient(var(--ground-dot) 1px, transparent 1.5px);
  background-size: 16px 16px;
  padding-inline: 16px;
  padding-block: 20px 28px;
}
.wrap { max-width: 1680px; margin: 0 auto; display: grid; gap: 14px; }
.game { display: grid; gap: 12px; justify-items: center; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
header p { flex: 1 1 16em; margin: 0; color: var(--muted); font-family: Galmuri9, system-ui, sans-serif; }
h1 {
  margin: 0; font: 700 24px/1.2 Galmuri11, system-ui, sans-serif; color: var(--frame);
  text-shadow: 2px 0 var(--ink), -2px 0 var(--ink), 0 2px var(--ink), 0 -2px var(--ink), 3px 3px 0 var(--red);
  letter-spacing: 1px;
}
.fs {
  align-self: center; font: 11px/1 Galmuri11, system-ui, sans-serif; color: var(--ink); cursor: pointer;
  background: var(--frame); border: 0; padding: 7px 10px 8px;
  box-shadow: 0 0 0 2px var(--ink), 0 3px 0 2px var(--red);
}
.fs:hover { background: #fffaf2; }
.fs:active { transform: translateY(2px); box-shadow: 0 0 0 2px var(--ink), 0 1px 0 2px var(--red); }
.fs:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
.screen {
  position: relative;
  /* 창 높이에 맞춰 16:9 화면이 한눈에 들어오게 */
  width: min(100%, calc((100vh - 150px) * 16 / 9 + 12px));
  width: min(100%, calc((100dvh - 150px) * 16 / 9 + 12px));
  min-width: min(100%, 320px);
  background: var(--frame);
  padding: 6px;
  box-shadow: 0 0 0 3px var(--ink), 6px 6px 0 3px var(--red);
}
.screen:fullscreen { width: 100vw; height: 100vh; padding: 0; box-shadow: none; background: #140d0a; display: grid; place-items: center; }
.screen:fullscreen .stage { width: min(100vw, calc(100vh * 16 / 9)); }
.screen:-webkit-full-screen { width: 100vw; height: 100vh; padding: 0; box-shadow: none; background: #140d0a; display: grid; place-items: center; }
.screen:-webkit-full-screen .stage { width: min(100vw, calc(100vh * 16 / 9)); }
.stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: #f1dfc0; box-shadow: inset 0 0 0 2px var(--frame-dark); }
.stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }
#game { image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; outline: none; }
#game:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.keys { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 0; padding: 0; list-style: none; color: var(--muted); font-family: Galmuri9, system-ui, sans-serif; }
.keys li { display: flex; align-items: center; gap: 6px; }
kbd {
  font: 11px/1 Galmuri11, ui-monospace, monospace; color: var(--ink); background: #fffaf2;
  padding: 4px 6px 5px; box-shadow: 0 2px 0 var(--frame-dark), 0 0 0 1px var(--ink);
}
footer { color: #9c8670; font-size: 11px; font-family: Galmuri7, Galmuri9, system-ui, sans-serif; }
@media (max-width: 520px) {
  h1 { font-size: 20px; }
  .screen { padding: 4px; }
}
</style>

// ---------- 색
const P = {

// ---------- 글꼴 (갈무리)
const F = { s: '7.5px Galmuri14', m: '10px Galmuri9', l: '12px Galmuri11', b: 'bold 12px Galmuri11', sys: 'bold 18px Galmuri11', xl: 'bold 24px Galmuri11' };

// ---------- 저장 (근무 일수만)
const KEY = 'rira-shift-v1';
let G = { day: 1, music: true, sfx: true };

    AU.fx = ac.createGain(); AU.fx.gain.value = G.sfx ? .6 : 0; AU.fx.connect(AU.out);

});

  if (o.to) fl.frequency.exponentialRampToValueAtTime(o.to, t + d);

  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);

const SFX = {
  pop() { tone(320, .12, { to: 960, v: .14 }); tone(1300, .06, { dt: .07, w: 'triangle', v: .1 }); },
  poof() { noise(.5, { f: 1800, to: 300, v: .25 }); },
  step() { noise(.04, { f: 240, ft: 'lowpass', v: .12 }); },
  blip() { tone(rnd(620, 760), .03, { v: .045 }); },
  rira() { for (let i = 0; i < 3; i++) tone(rnd(1000, 1500), .05, { dt: i * .065, w: 'triangle', v: .1, to: rnd(1100, 1700) }); },
  stamp() { tone(130, .16, { w: 'sine', to: 45, v: .55 }); noise(.09, { f: 700, ft: 'lowpass', v: .3 }); },
  good() { tone(880, .08, { w: 'triangle', v: .14 }); tone(1320, .12, { dt: .07, w: 'triangle', v: .12 }); },
  buzz() { tone(150, .22, { w: 'sawtooth', v: .09 }); },
  ding() { tone(1320, .3, { w: 'triangle', v: .16 }); tone(1760, .4, { dt: .1, w: 'triangle', v: .12 }); },
  churn() { noise(.07, { f: 500, v: .16 }); tone(170, .07, { w: 'sine', to: 110, v: .18 }); },
  twist() { noise(.06, { f: 2600, v: .05 }); },
  tear() { noise(.3, { f: 1600, q: 3, v: .3 }); },
  squish() { tone(210, .12, { w: 'sine', to: 110, v: .3 }); noise(.07, { f: 380, ft: 'lowpass', v: .14 }); },
  tick() { tone(1800, .02, { w: 'square', v: .03 }); },
  place() { tone(260, .09, { w: 'triangle', v: .2 }); noise(.05, { f: 900, v: .1 }); },
  stitch() { tone(2200, .03, { w: 'triangle', v: .07 }); tone(1600, .03, { dt: .04, w: 'triangle', v: .05 }); },
  drop() { tone(900, .15, { w: 'sine', to: 300, v: .12 }); },
  grind() { noise(.09, { f: 3000, q: 2, v: .12 }); },

  incomplete() { ['G4', 'E4', 'C4'].forEach((n, i) => tone(hz(n), .18, { dt: i * .13, v: .12 })); tone(98, .45, { dt: .39, w: 'sawtooth', v: .1 }); },
  unlock() { ['C5', 'E5', 'G5', 'C6', 'E6'].forEach((n, i) => tone(hz(n), .14, { dt: i * .07, v: .1 })); tone(hz('G6'), .5, { dt: .38, w: 'triangle', v: .12 }); },

// 배경음악: 한 곡의 선율(리라 근무가)을 장면마다 빠르기·악기를 바꿔 되풀이한다
const CH = {

  C: ['C3', 'G2', ['E3', 'G3']], Am: ['A2', 'E3', ['C4', 'E4']], G: ['G2', 'D3', ['B3', 'D4']],
};
const THEME = 'A4 C5 F5 C5 E5 D5 C5 Bb4 A4 C5 A4 F4 G4 . . . D5 F5 D5 Bb4 C5 A4 F4 A4 G4 Bb4 E5 G5 F5 . C5 .';
const SONG = {
  room: { bpm: 126, lead: THEME, bars: 'F C7 F C7 Bb F C7 F', lw: 'square', lv: .045, oompah: true },
  work: { bpm: 156, lead: 'F5 . A5 F5 C5 . A4 C5 Bb4 . G4 Bb4 E5 . C5 . F5 . A5 F5 C5 . F5 A5 G5 F5 E5 D5 C5 . . .', bars: 'F F C7 C7 F F C7 F', lw: 'triangle', lv: .08, oompah: true, hat: true },
  wait: { bpm: 80, lead: 'E5 . D5 . C5 . . . D5 . E5 . G5 . . . F5 . E5 . D5 . C5 . B4 . C5 . D5 . . .', bars: 'C Am G G F Am G C', lw: 'sine', lv: .09, pad: true },

for (const k in SONG) { SONG[k].lead = SONG[k].lead.split(' '); if (SONG[k].bars) SONG[k].bars = SONG[k].bars.split(' '); }

  if (AU.track === name) return;

}
function musicTick() {
  const ac = AU.ac; if (!ac || !AU.track || !G.music) return;

// ---------- 픽셀 격자: 고해상도(0.5칸) 격자에 도형을 찍고 바깥 테두리를 둘러 캔버스로 굳힌다

  let guard = 0;
  while (SCR && guard++ < 60) {
    if (SCR.w) { if (!SCR.w(dt)) return; SCR.w = null; dt = 0; }
    const r = SCR.it.next();
    if (r.done) { SCR = null; return; }
    SCR.w = r.value || null;
  }
}
const wait = t => { let e = 0; return dt => (e += dt) >= t; };
const walkTo = x => { PL.auto = x; return () => PL.auto === null; };
const pressW = () => () => { if (I.p) { I.p = false; return true; } return false; };

  SYS = { msg, kind, n: 0, t: 0 };

  yield () => !SYS;
}

function tryLeave() {
  PL.tgt = null; leaveCD = .8;
  if (STAGE === 'intro') return run(scriptFirstDoor());
  const p = pending();
  if (p.includes('signOut')) return beginTask('signOut');
  if (p.length) return run(scriptIncomplete());
  run(scriptUnlock());
}

function updateMG(dt) {
